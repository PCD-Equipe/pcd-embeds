<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TerraCheck</title>
<style>/* TerraCheck — Design tokens
   Based on Figma SPCD charte + DESIGN-SYSTEM.md ("Digital Arboretum")
   - Forest green primary (#23442A from Figma)
   - Cream / ivory surfaces
   - Terracotta accent
   - Recoleta (display serif) + Satoshi (body) via Fontshare
*/

@import url('https://api.fontshare.com/v2/css?f[]=recoleta@400,500,600,700&f[]=satoshi@300,400,500,700&display=swap');

:root {
  /* === Core palette (from Figma METADATA + SPCD) === */
  --tc-forest-900: #0F2414;   /* rgb(15,36,20) — deepest ink */
  --tc-forest-800: #23442A;   /* rgb(35,68,42) — primary brand */
  --tc-forest-700: #2F663B;   /* rgb(47,102,59) */
  --tc-forest-500: #438E52;   /* rgb(67,142,82) — emerald accent */
  --tc-forest-300: #A0D5AA;   /* rgb(160,213,170) */
  --tc-forest-200: #CAE8CF;   /* rgb(202,232,207) */
  --tc-forest-100: #E4F4E6;   /* rgb(228,244,230) */
  --tc-forest-50:  #F3FAF4;   /* rgb(243,250,244) — palest */

  /* Cream / ivory surfaces */
  --tc-cream:      #FBFAF9;   /* rgb(251,250,249) */
  --tc-cream-2:    #F6F6F0;   /* rgb(246,246,240) */

  /* Accent: warm ocre/terracotta (from DS + Figma terracotta) */
  --tc-ocre-500:   #9C8D56;   /* rgb(156,141,86) — ocre */
  --tc-ocre-200:   #D6D3B2;
  --tc-terra-500:  #E07400;   /* rgb(224,116,0) */
  --tc-terra-600:  #B85A00;
  --tc-terra-100:  #FED3C7;   /* MD3 secondary-container */

  /* Alert / warning */
  --tc-alert-700:  #5F1104;   /* deep alert */
  --tc-alert-500:  #FF523B;   /* rgb(255,82,59) */

  /* Yellow (badge / highlight) */
  --tc-yellow-400: #FFDE67;   /* rgb(255,222,103) */

  /* Neutrals */
  --tc-ink:        #1B1C1A;
  --tc-ink-70:     #424843;
  --tc-ink-50:     rgba(27,28,26,0.5);
  --tc-ink-25:     rgba(27,28,26,0.22);
  --tc-ink-10:     rgba(27,28,26,0.10);
  --tc-line:       rgba(27,28,26,0.08);

  /* Soil-profile colours (for the 5 palettes) */
  --tc-soil-argileux: #8B5A3C;   /* clay brown-red */
  --tc-soil-sableux:  #D4B896;   /* sand beige */
  --tc-soil-limoneux: #A68961;   /* silt warm brown */
  --tc-soil-humifere: #3E2817;   /* humus near-black brown */
  --tc-soil-calcaire: #D9D2B8;   /* chalk pale */

  /* === Themeable accent (Tweaks) === */
  --tc-accent:        var(--tc-forest-800);
  --tc-accent-light:  var(--tc-forest-100);
  --tc-accent-on:     #ffffff;

  /* === Typography === */
  --tc-font-display: 'Recoleta', 'Cormorant Garamond', Georgia, serif;
  --tc-font-body:    'Satoshi', -apple-system, 'Helvetica Neue', sans-serif;
  --tc-font-mono:    'JetBrains Mono', ui-monospace, monospace;

  /* Type scale */
  --tc-text-xs:   12px;
  --tc-text-sm:   13px;
  --tc-text-base: 15px;
  --tc-text-md:   17px;
  --tc-text-lg:   20px;
  --tc-text-xl:   24px;
  --tc-text-2xl:  32px;
  --tc-text-3xl:  40px;
  --tc-text-4xl:  56px;

  /* === Radii === */
  --tc-r-xs: 4px;
  --tc-r-sm: 8px;
  --tc-r-md: 12px;
  --tc-r-lg: 20px;
  --tc-r-xl: 28px;
  --tc-r-pill: 999px;

  /* === Elevation (tonal, not shadows first) === */
  --tc-shadow-sm: 0 1px 2px rgba(15,36,20,0.04), 0 2px 8px rgba(15,36,20,0.03);
  --tc-shadow-md: 0 4px 16px rgba(15,36,20,0.06), 0 1px 3px rgba(15,36,20,0.04);
  --tc-shadow-lg: 0 20px 40px rgba(15,36,20,0.10), 0 4px 12px rgba(15,36,20,0.05);
}

/* === Base reset === */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--tc-font-body);
  font-size: var(--tc-text-base);
  color: var(--tc-ink);
  background: var(--tc-cream);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  line-height: 1.5;
}

h1, h2, h3, h4, h5 {
  font-family: var(--tc-font-display);
  font-weight: 500;
  letter-spacing: -0.015em;
  line-height: 1.1;
  color: var(--tc-forest-900);
  margin: 0;
}

button { font-family: inherit; cursor: pointer; border: 0; background: none; padding: 0; color: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; color: inherit; }

/* === Reusable atoms === */

.tc-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 20px;
  border-radius: var(--tc-r-md);
  font-weight: 500;
  font-size: var(--tc-text-base);
  transition: transform 120ms ease, background 180ms ease, box-shadow 180ms ease;
  white-space: nowrap;
  line-height: 1;
}
.tc-btn:active { transform: translateY(1px); }

.tc-btn--primary {
  background: var(--tc-accent);
  color: var(--tc-accent-on);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05), var(--tc-shadow-sm);
}
.tc-btn--primary:hover { background: var(--tc-forest-900); }

.tc-btn--ghost {
  background: transparent;
  color: var(--tc-forest-800);
  padding: 10px 14px;
}
.tc-btn--ghost:hover { background: var(--tc-forest-100); }

.tc-btn--outline {
  background: var(--tc-cream);
  color: var(--tc-forest-800);
  box-shadow: inset 0 0 0 1px var(--tc-ink-10);
}
.tc-btn--outline:hover { box-shadow: inset 0 0 0 1px var(--tc-forest-800); }

.tc-btn--sm { padding: 8px 14px; font-size: var(--tc-text-sm); border-radius: var(--tc-r-sm); }
.tc-btn--lg { padding: 16px 28px; font-size: var(--tc-text-md); border-radius: var(--tc-r-lg); }

/* Chip */
.tc-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--tc-r-pill);
  background: var(--tc-forest-100);
  color: var(--tc-forest-800);
  font-size: var(--tc-text-sm);
  font-weight: 500;
  line-height: 1;
  transition: background 150ms ease;
}
.tc-chip--ocre { background: var(--tc-terra-100); color: var(--tc-alert-700); }
.tc-chip--yellow { background: var(--tc-yellow-400); color: var(--tc-forest-900); }
.tc-chip--ghost { background: transparent; color: var(--tc-ink-70); box-shadow: inset 0 0 0 1px var(--tc-ink-10); }
.tc-chip button, button.tc-chip { cursor: pointer; }
.tc-chip[data-active="true"] { background: var(--tc-forest-800); color: var(--tc-cream); }

/* Card */
.tc-card {
  background: var(--tc-cream);
  border-radius: var(--tc-r-lg);
  padding: 24px;
}
.tc-card--raised {
  background: #fff;
  box-shadow: var(--tc-shadow-md);
}
.tc-card--forest {
  background: var(--tc-forest-800);
  color: var(--tc-cream);
}
.tc-card--pale { background: var(--tc-forest-50); }

/* Soft-well input */
.tc-field {
  display: block;
  width: 100%;
  padding: 14px 16px;
  background: var(--tc-forest-50);
  border: 0;
  border-bottom: 2px solid transparent;
  border-radius: var(--tc-r-sm) var(--tc-r-sm) 0 0;
  font-size: var(--tc-text-base);
  transition: border-color 180ms ease, background 180ms ease;
}
.tc-field:focus { outline: none; border-bottom-color: var(--tc-forest-800); background: var(--tc-cream); }
.tc-field::placeholder { color: var(--tc-ink-50); }

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--tc-ink-10); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--tc-ink-25); }

/* Screen wrapper */
.tc-screen { display: flex; flex-direction: column; min-height: 100%; }

/* Type utilities */
.tc-display { font-family: var(--tc-font-display); font-weight: 500; letter-spacing: -0.02em; }
.tc-mono-num { font-variant-numeric: tabular-nums; }
.tc-uppercase-s { text-transform: uppercase; letter-spacing: 0.08em; font-size: var(--tc-text-xs); font-weight: 500; }

/* Small label pattern from SPCD (over cards) */
.tc-eyebrow {
  font-family: var(--tc-font-body);
  font-size: var(--tc-text-xs);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--tc-ink-70);
  font-weight: 500;
}

/* Focus */
:focus-visible { outline: 2px solid var(--tc-forest-500); outline-offset: 2px; border-radius: var(--tc-r-xs); }

/* Anim helpers */
@keyframes tc-fade-up {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.tc-anim-in { animation: tc-fade-up 300ms cubic-bezier(0.22, 1, 0.36, 1) both; }

html, body, #root { height: 100%; } body { overflow-x: hidden; }</style></head><body><div id="root"></div>

function Icon({ name, size = 20, color = 'currentColor', strokeWidth = 1.6, style = {} }) {
  const d = ICONS[name];
  if (!d) return null;
  return (
    <svg
      width={size} height={size} viewBox="0 0 24 24"
      fill="none" stroke={color} strokeWidth={strokeWidth}
      strokeLinecap="round" strokeLinejoin="round"
      style={{ display: 'inline-block', flexShrink: 0, ...style }}
      aria-hidden="true"
    >
      {d.split(' M').map((p, i) => (

      ))}
    </svg>
  );
}

// ---------- Soil profile visual ----------
function SoilGlyph({ profile, size = 64 }) {
  const { id, hex } = profile;
  const s = size;
  if (id === 'argileux') {
    return <svg width={s} height={s} viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill={hex} /><circle cx="32" cy="32" r="12" fill="var(--tc-cream)" /></svg>;
  }
  if (id === 'sableux') {
    return <svg width={s} height={s} viewBox="0 0 64 64">
      {Array.from({length: 40}).map((_,i) => {
        const x = (i*37)%56 + 4, y = (i*29)%56 + 4;
        return <circle key={i} cx={x} cy={y} r="1.8" fill={hex} />;
      })}
    </svg>;
  }
  if (id === 'limoneux') {
    return <svg width={s} height={s} viewBox="0 0 64 64">
      <path d="M4 28c8-6 16 6 24 0s16 6 24 0M4 40c8-6 16 6 24 0s16 6 24 0" fill="none" stroke={hex} strokeWidth="3" strokeLinecap="round"/>
    </svg>;
  }
  if (id === 'humifere') {
    return <svg width={s} height={s} viewBox="0 0 64 64">
      <circle cx="22" cy="22" r="10" fill={hex}/>
      <circle cx="42" cy="26" r="8" fill={hex} opacity="0.75"/>
      <circle cx="30" cy="42" r="12" fill={hex} opacity="0.9"/>
      <circle cx="46" cy="46" r="6" fill={hex} opacity="0.7"/>
    </svg>;
  }
  return <svg width={s} height={s} viewBox="0 0 64 64">
    <polygon points="32,8 54,24 48,52 16,52 10,24" fill={hex} stroke="var(--tc-forest-900)" strokeWidth="1.5" strokeOpacity="0.15"/>
    <polygon points="32,18 44,28 40,44 24,44 20,28" fill="var(--tc-cream)" opacity="0.6"/>
  </svg>;
}

              style={{
                textAlign: 'left', padding: 14, borderRadius: 18, cursor: 'pointer',

                  ? 'inset 0 0 0 2px var(--tc-forest-800)'

// Bio-indication: search + filter + cumulative diagnosis
function BioIndicScreen({ onBack, selected, setSelected, onConfirm }) {
  const [query, setQuery] = React.useState('');
  const [activeTag, setActiveTag] = React.useState(null);
  const plants = window.PLANTS;

  const filtered = plants.filter(p => {
    if (activeTag && !p.tags.includes(activeTag)) return false;
    if (query) {
      const q = query.toLowerCase();
      return p.nom.toLowerCase().includes(q) || p.sci.toLowerCase().includes(q);
    }
    return true;
  });

  // Cumulative diagnosis
  const scores = {};
  selected.forEach(id => {
    const p = plants.find(pp => pp.id === id);
    if (!p) return;
    p.tags.forEach(t => { scores[t] = (scores[t] || 0) + 1; });
  });
  const sortedScores = Object.entries(scores).sort((a,b) => b[1]-a[1]);
  const topTag = sortedScores[0];

  const filters = ['compactage', 'hydromorphisme', 'acidité', 'alcalinité', 'excès N', 'équilibre'];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100%' }}>

            <Icon name="search" size={18} />

        </div>
      </div>

      {/* Filter chips */}
      <div style={{ padding: '0 20px 12px', display: 'flex', gap: 6, overflowX: 'auto' }}>
        <FilterChip label="Tous" active={!activeTag} onClick={() => setActiveTag(null)} />
        {filters.map(t => (
          <FilterChip key={t} label={window.TAG_META[t].label} active={activeTag === t}
            onClick={() => setActiveTag(activeTag === t ? null : t)} />
        ))}
      </div>

      {/* Diagnostic summary (sticky) */}
      {selected.length > 0 && (
        <div style={{
          margin: '0 20px 12px', padding: '14px 16px', borderRadius: 18,
          background: 'var(--tc-forest-800)', color: 'var(--tc-cream)',
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8 }}>
            <div className="tc-eyebrow" style={{ color: 'var(--tc-forest-300)' }}>Diagnostic cumulé</div>
            <span className="tc-mono-num" style={{ fontSize: 12, fontWeight: 600 }}>{selected.length} plante{selected.length>1?'s':''}</span>
          </div>
          {topTag && (
            <div style={{ fontFamily: 'var(--tc-font-display)', fontSize: 18, lineHeight: 1.25, letterSpacing: '-0.01em' }}>
              Tendance dominante : <em style={{ color: 'var(--tc-forest-300)' }}>{window.TAG_META[topTag[0]].label.toLowerCase()}</em>
            </div>
          )}
          <div style={{ marginTop: 10, display: 'flex', flexWrap: 'wrap', gap: 6 }}>
            {sortedScores.slice(0,5).map(([t,c]) => (
              <span key={t} style={{
                padding: '4px 10px', borderRadius: 999, background: 'rgba(255,255,255,0.12)',
                fontSize: 12, fontWeight: 500, display: 'inline-flex', alignItems: 'center', gap: 6,
              }}>{window.TAG_META[t].label} <b className="tc-mono-num">×{c}</b></span>

      {/* Plant list */}
      <div style={{ padding: '0 20px 100px', display: 'flex', flexDirection: 'column', gap: 8 }}>

// Mission Boudin — guided questionnaire
function BoudinScreen({ onBack, onFinish }) {
  const [step, setStep] = React.useState(0);
  const [answers, setAnswers] = React.useState({});

  const questions = [
    {
      id: 'shape', q: "Arrivez-vous à former un boudin de terre humide ?",
      options: [
        { v: 'no',    label: "Non, ça s'effrite",          hint: '→ Tendance sableuse' },
        { v: 'crack', label: "Oui mais il se fendille",     hint: '→ Limoneux' },
        { v: 'yes',   label: "Oui, un boudin lisse et fin", hint: '→ Argileux' },
      ],
    },
    {
      id: 'ring', q: "Pouvez-vous recourber ce boudin en cerceau ?",
      options: [
        { v: 'no',      label: "Il casse net" },
        { v: 'partial', label: "Il casse au milieu" },
        { v: 'yes',     label: "Oui, cerceau parfait" },
      ],
    },
    {
      id: 'skin', q: "La terre laisse-t-elle une trace sur votre peau ?",
      options: [
        { v: 'clean',  label: 'Mains propres, poussière sèche' },
        { v: 'tint',   label: 'Coloration légère (terre douce)' },
        { v: 'sticky', label: 'Très collante, laisse une pellicule' },
      ],
    },
  ];

  // Classify
  const classify = () => {
    const { shape, ring, skin } = answers;
    if (shape === 'no' || skin === 'clean') return 'sableux';
    if (ring === 'yes' || (shape === 'yes' && skin === 'sticky')) return 'argileux';
    return 'limoneux';
  };

  if (step >= questions.length) {
    const result = classify();
    const soil = window.SOIL_PROFILES.find(s => s.id === result);
    return (
      <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100%' }}>
        <AppHeader title="Test du Boudin" onBack={onBack} subtitle="Résultat" />
        <div style={{ padding: 20, textAlign: 'center' }}>
          <div className="tc-eyebrow">Verdict tactile</div>
          <div style={{
            margin: '20px auto', width: 140, height: 140, borderRadius: 999,
            background: soil.hex,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <SoilGlyph profile={soil} size={90} />
          </div>
          <h2 style={{ fontSize: 32 }}>Sol {soil.name.toLowerCase()}</h2>
          <div style={{ fontSize: 14, color: 'var(--tc-forest-700)', fontStyle: 'italic', marginTop: 4 }}>« {soil.tagline} »</div>
          <div style={{ fontSize: 14, color: 'var(--tc-ink-70)', marginTop: 14, maxWidth: 300, margin: '14px auto 0' }}>
            {soil.character}
          </div>
          <button className="tc-btn tc-btn--primary tc-btn--lg" onClick={()=>onFinish(result)}
            style={{ marginTop: 28, width: '100%' }}>
            Valider et continuer <Icon name="arrow_right" size={18} />
          </button>
        </div>
      </div>
    );
  }

  const q = questions[step];
  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100%' }}>
      <AppHeader title="Test du Boudin" onBack={onBack} subtitle={`Question ${step+1}/${questions.length}`} />

      {/* Progress dots */}
      <div style={{ padding: '0 20px 16px', display: 'flex', gap: 6 }}>
        {questions.map((_, i) => (
          <div key={i} style={{
            flex: 1, height: 4, borderRadius: 2,
            background: i <= step ? 'var(--tc-forest-800)' : 'var(--tc-forest-100)',
          }} />
        ))}
      </div>

      <div style={{ padding: '0 20px' }}>
        <h2 style={{ fontSize: 26, letterSpacing: '-0.01em', lineHeight: 1.2 }}>{q.q}</h2>

        <div style={{ marginTop: 24, display: 'flex', flexDirection: 'column', gap: 10 }}>
          {q.options.map(opt => {
            const sel = answers[q.id] === opt.v;
            return (
              <button key={opt.v}
                onClick={() => {
                  setAnswers({ ...answers, [q.id]: opt.v });
                  setTimeout(() => setStep(step + 1), 280);
                }}
                style={{
                  textAlign: 'left', padding: '16px 18px', borderRadius: 18, cursor: 'pointer',
                  background: sel ? 'var(--tc-forest-800)' : '#fff',
                  color: sel ? 'var(--tc-cream)' : 'var(--tc-forest-900)',
                  boxShadow: sel ? 'var(--tc-shadow-md)' : 'inset 0 0 0 1px var(--tc-line)',
                  transition: 'all 180ms',
                }}>
                <div style={{ fontSize: 16, fontWeight: 500 }}>{opt.label}</div>
                {opt.hint && <div style={{ fontSize: 12, opacity: 0.7, marginTop: 3, fontStyle: 'italic' }}>{opt.hint}</div>}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// Mission Bocal — sedimentation + textures triangle
function BocalScreen({ onBack, onFinish }) {
  const [sand, setSand] = React.useState(40);
  const [silt, setSilt] = React.useState(30);
  const [clay, setClay] = React.useState(15);
  const [organic, setOrganic] = React.useState(5);

  const total = sand + silt + clay + organic;
  const pct = total ? {
    sand: Math.round(sand/total*1000)/10,
    silt: Math.round(silt/total*1000)/10,
    clay: Math.round(clay/total*1000)/10,
    organic: Math.round(organic/total*1000)/10,
  } : { sand:0, silt:0, clay:0, organic:0 };

  const classify = () => {
    const { sand: s, silt: l, clay: c } = pct;
    if (c >= 40) return 'Argileux';
    if (c >= 25 && s >= 45) return 'Argilo-sableux';
    if (c >= 25) return 'Limono-argileux';
    if (l >= 50 && c < 15) return 'Limoneux fin';
    if (l >= 40) return 'Limoneux demi-fin';
    if (s >= 70) return 'Sableux';
    return 'Limono-sableux';
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100%' }}>
      <AppHeader title="Test du Bocal" onBack={onBack} subtitle="Mission 4 · Sédimentation" />

      <div style={{ padding: '0 20px 20px' }}>
        <div style={{ fontSize: 14, color: 'var(--tc-ink-70)', lineHeight: 1.5, marginBottom: 18 }}>
          Après 24h de sédimentation, mesurez chaque strate en millimètres.
        </div>

        {/* Animated jar */}
        <div style={{ display: 'flex', gap: 24, alignItems: 'stretch', marginBottom: 24 }}>
          <Jar sand={sand} silt={silt} clay={clay} organic={organic} />
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 10 }}>
            <StrateInput label="M.O."   value={organic} onChange={setOrganic} color="#3E2817" pct={pct.organic} />
            <StrateInput label="Argile" value={clay} onChange={setClay} color="#8B5A3C" pct={pct.clay} />
            <StrateInput label="Limon"  value={silt} onChange={setSilt} color="#A68961" pct={pct.silt} />
            <StrateInput label="Sable"  value={sand} onChange={setSand} color="#D4B896" pct={pct.sand} />
          </div>
        </div>

        {/* Triangle */}
        <div style={{ background: '#fff', borderRadius: 20, padding: 16, boxShadow: 'var(--tc-shadow-sm)' }}>
          <div className="tc-eyebrow" style={{ marginBottom: 8 }}>Triangle des textures</div>
          <TextureTriangle sand={pct.sand} silt={pct.silt} clay={pct.clay} />
          <div style={{ marginTop: 12, textAlign: 'center' }}>
            <div className="tc-eyebrow" style={{ color: 'var(--tc-forest-500)' }}>Classification</div>
            <div style={{ fontFamily: 'var(--tc-font-display)', fontSize: 24, fontWeight: 500, color: 'var(--tc-forest-900)', marginTop: 4 }}>
              {classify()}
            </div>
          </div>
        </div>

        <button className="tc-btn tc-btn--primary tc-btn--lg" onClick={() => onFinish(classify())}
          style={{ width: '100%', marginTop: 20 }}>
          Enregistrer le résultat <Icon name="check" size={18} />
        </button>
      </div>
    </div>
  );
}

            }} />

        </div>

function Jar({ sand, silt, clay, organic }) {
  const total = sand + silt + clay + organic || 1;
  const H = 300, W = 140;
  const innerTop = 56, innerBot = H - 16;
  const innerH = innerBot - innerTop;
  const unit = innerH / total;

  // Heights
  const hSand = sand * unit;
  const hSilt = silt * unit;
  const hClay = clay * unit;
  const hOrg  = organic * unit;

  // y coords (bottom-up stack): sand at bottom, then silt, clay, organic floating on water top
  const ySandTop = innerBot - hSand;
  const ySiltTop = ySandTop - hSilt;
  const yClayTop = ySiltTop - hClay;
  // Organic floats at the top of the water (under the air)
  const yOrgBot  = innerTop + 4;
  const yOrgTop  = yOrgBot + hOrg * 0.6; // thin floating debris
  // Water fills from clay top up to near the cap
  const yWaterTop = innerTop + 4;

  return (
    <svg width="120" height={H} viewBox={`0 0 ${W} ${H}`}
      style={{ filter: 'drop-shadow(0 8px 16px rgba(15,36,20,0.12))' }}>
      <defs>
        <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stopColor="#fff" stopOpacity="0.55"/>

function TextureTriangle({ sand, silt, clay }) {
  const W = 320, H = 300, pad = 30;
  // Corners: clay (top), sand (bottom-left), silt (bottom-right)
  const A = { x: W/2,     y: pad };        // 100% argile
  const B = { x: pad,     y: H - pad };    // 100% sable
  const C = { x: W - pad, y: H - pad };    // 100% limon
  // barycentric (c=clay, s=sand, l=silt, c+s+l=1) → cartesian
  const P = (c, s, l) => ({
    x: A.x*c + B.x*s + C.x*l,
    y: A.y*c + B.y*s + C.y*l,
  });
  // GEPPA-style zones (c, s, l values) polygons — values sum to 1
  // Order: from top to bottom
  const zones = [
    {
      name: 'Argileux', color: '#A8D0E6',
      pts: [[1,0,0],[0.6,0,0.4],[0.6,0.4,0]],
    },
    {
      name: 'Argilo-sableux', color: '#7EAEDC',
      pts: [[0.6,0.4,0],[0.3,0.7,0],[0.3,0.45,0.25],[0.45,0.3,0.25]],
    },
    {
      name: 'Limono-argileux', color: '#9DB4E0',
      pts: [[0.6,0.4,0],[0.45,0.3,0.25],[0.3,0.25,0.45],[0.3,0,0.7],[0.6,0,0.4]],
    },
    {
      name: 'Limono-sableux', color: '#C8E0B0',
      pts: [[0.3,0.7,0],[0.15,0.85,0],[0.15,0.6,0.25],[0.3,0.45,0.25]],
    },
    {
      name: 'Limoneux fin', color: '#B4D88C',
      pts: [[0.3,0.25,0.45],[0.15,0.3,0.55],[0.15,0.1,0.75],[0.3,0,0.7]],
    },
    {
      name: 'Limoneux demi-fin', color: '#8BC37A',
      pts: [[0.3,0.45,0.25],[0.15,0.6,0.25],[0.15,0.3,0.55],[0.3,0.25,0.45]],
    },
    {
      name: 'Sableux', color: '#E0D884',
      pts: [[0.15,0.85,0],[0,1,0],[0,0.85,0.15],[0.15,0.6,0.25]],
    },
  ];

  const fmt = pts => pts.map(([c,s,l]) => {
    const p = P(c,s,l);
    return p.x.toFixed(1)+','+p.y.toFixed(1);
  }).join(' ');

  // Current point
  const c = clay/100, s = sand/100, l = silt/100;
  const tot = c+s+l || 1;
  const pt = P(c/tot, s/tot, l/tot);

  // Which zone is the point in? (simple label match by thresholds)
  const zoneOf = () => {
    const cp = c/tot*100, sp = s/tot*100, lp = l/tot*100;
    if (cp >= 60) return 'Argileux';
    if (cp >= 30 && sp >= 30) return 'Argilo-sableux';
    if (cp >= 30) return 'Limono-argileux';
    if (cp >= 15 && sp >= 60) return 'Limono-sableux';
    if (cp >= 15 && lp >= 55) return 'Limoneux fin';
    if (cp >= 15) return 'Limoneux demi-fin';
    if (sp >= 85) return 'Sableux';
    return 'Limoneux demi-fin';
  };
  const current = zoneOf();

  // Grid lines (every 20%)
  const gridLines = [];
  [20, 40, 60, 80].forEach(v => {
    const t = v/100;
    // lines parallel to each side
    const a1 = P(1-t, t, 0), a2 = P(1-t, 0, t);
    const b1 = P(t, 1-t, 0), b2 = P(0, 1-t, t);
    const c1 = P(t, 0, 1-t), c2 = P(0, t, 1-t);
    gridLines.push([a1,a2],[b1,b2],[c1,c2]);
  });

  return (
    <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{ display: 'block' }}>
      {/* Zones */}
      {zones.map(z => (
        <polygon key={z.name} points={fmt(z.pts)}
          fill={z.color}
          fillOpacity={z.name === current ? 1 : 0.55}
          stroke="rgba(27,28,26,0.25)" strokeWidth="0.6" />
      ))}
      {/* Outer triangle */}
      <polygon points={`${A.x},${A.y} ${B.x},${B.y} ${C.x},${C.y}`}
        fill="none" stroke="var(--tc-forest-900)" strokeWidth="1.4"/>
      {/* Grid */}
      {gridLines.map((ln, i) => (
        <line key={i} x1={ln[0].x} y1={ln[0].y} x2={ln[1].x} y2={ln[1].y}
          stroke="rgba(27,28,26,0.18)" strokeWidth="0.4" strokeDasharray="2 2"/>
      ))}
      {/* Zone names at centroids */}
      {zones.map(z => {
        const cx = z.pts.reduce((a,p)=>a+P(p[0],p[1],p[2]).x,0)/z.pts.length;
        const cy = z.pts.reduce((a,p)=>a+P(p[0],p[1],p[2]).y,0)/z.pts.length;
        const isCurrent = z.name === current;
        // Split long names into 2 lines
        const words = z.name.split(/[-\s]/);
        const lines = words.length >= 2 ? [words[0] + (z.name.includes('-') ? '-' : ''), words.slice(1).join(' ')] : [z.name];
        return (
          <g key={'lbl'+z.name}>
            {lines.map((ln, i) => (
              <text key={i} x={cx} y={cy + (i - (lines.length-1)/2) * 8}
                textAnchor="middle" fontSize="7.5"
                fill={isCurrent ? 'var(--tc-forest-900)' : 'rgba(15,36,20,0.75)'}
                fontWeight={isCurrent ? 700 : 500}
                fontFamily="var(--tc-font-body)"
                style={{ pointerEvents: 'none' }}>
                {ln}
              </text>
            ))}
          </g>
        );
      })}
      {/* Axis labels */}
      <text x={A.x} y={A.y-10} textAnchor="middle" fontSize="9"
        fill="var(--tc-forest-900)" fontWeight="700"
        style={{ textTransform: 'uppercase', letterSpacing: '0.1em' }}>ARGILE</text>
      <text x={B.x-4} y={B.y+18} textAnchor="start" fontSize="9"
        fill="var(--tc-forest-900)" fontWeight="700"
        style={{ textTransform: 'uppercase', letterSpacing: '0.1em' }}>SABLE</text>
      <text x={C.x+4} y={C.y+18} textAnchor="end" fontSize="9"
        fill="var(--tc-forest-900)" fontWeight="700"
        style={{ textTransform: 'uppercase', letterSpacing: '0.1em' }}>LIMON</text>
      {/* Point */}
      <circle cx={pt.x} cy={pt.y} r="14" fill="var(--tc-forest-800)" opacity="0.18"/>
      <circle cx={pt.x} cy={pt.y} r="6.5" fill="var(--tc-forest-800)" stroke="#fff" strokeWidth="2"
        style={{ transition: 'cx 400ms, cy 400ms' }} />
      {/* Current zone label */}
      <text x={W/2} y={H-6} textAnchor="middle" fontSize="10"
        fill="var(--tc-forest-800)" fontStyle="italic">{current}</text>
    </svg>
  );
}

function DashboardScreen({ zone, selectedPlants, bocalResult, boudinResult, onBack }) {
  const soil = window.SOIL_PROFILES.find(s => s.id === (boudinResult || zone.soilGuess));
  const plants = (selectedPlants || []).map(id => window.PLANTS.find(p => p.id === id)).filter(Boolean);

  // Top bio tag
  const scores = {};
  plants.forEach(p => p.tags.forEach(t => scores[t] = (scores[t]||0) + 1));
  const topTags = Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,3);

  const recs = [];
  if (boudinResult === 'argileux') recs.push({ title: 'Sablage de structure', body: 'Apport de sables grossiers pour favoriser l\'infiltration.', dose: '5–10 kg/m²' });
  if (topTags.some(([t])=>t==='acidité')) recs.push({ title: 'Redressement du pH', body: 'Chaux, calcaire broyé ou algues calcifiées.', dose: '300–600 g/m²' });
  recs.push({ title: 'Régénération par l\'humus', body: 'Compost mûr ou terreau de feuilles, tous les 1–3 ans.', dose: '3–5 kg/m²' });

  return (
    <div style={{ display: 'flex', flexDirection: 'column', minHeight: '100%' }}>

        <div style={{ fontFamily: 'var(--tc-font-display)', fontSize: 34, lineHeight: 1.1, letterSpacing: '-0.02em', marginTop: 6 }}>
          Votre sol est <em style={{ color: 'var(--tc-forest-300)' }}>{bocalResult?.toLowerCase() || (soil ? soil.name.toLowerCase() : '—')}</em>
        </div>
        <div style={{ fontSize: 14, marginTop: 10, opacity: 0.85, lineHeight: 1.5 }}>
          {plants.length > 0
            ? `Les ${plants.length} plante${plants.length>1?'s':''} observée${plants.length>1?'s':''} révèlent une tendance ${topTags[0] ? window.TAG_META[topTags[0][0]].label.toLowerCase() : 'équilibrée'}.`
            : 'Poursuivez les tests pour affiner le diagnostic.'}
        </div>

        {/* Carbon badge */}
        <div style={{ marginTop: 18, padding: '10px 14px', background: 'rgba(255,255,255,0.08)', borderRadius: 12, display: 'flex', alignItems: 'center', gap: 10 }}>
          <div style={{ fontSize: 20 }}>🌍</div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12, fontWeight: 600, letterSpacing: '0.04em', textTransform: 'uppercase', color: 'var(--tc-forest-300)' }}>Score carbone</div>
            <div style={{ fontSize: 13, marginTop: 2 }}>Potentiel de séquestration <b>modéré</b></div>

        </div>
      </div>

      {/* Tests summary */}
      <div style={{ padding: '20px 20px 8px' }}>
        <h2 style={{ fontSize: 20, marginBottom: 12 }}>Ce qu'on a appris</h2>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {boudinResult && <SummaryLine label="Texture — Boudin" value={`Sol ${boudinResult}`} />}
          {bocalResult && <SummaryLine label="Texture — Bocal" value={bocalResult} />}
          {plants.length > 0 && <SummaryLine label="Bio-indication" value={`${plants.length} plantes identifiées`} />}
          {topTags[0] && <SummaryLine label="Tendance dominante" value={window.TAG_META[topTags[0][0]].label} />}

      </div>

      {/* Recommendations */}
      <div style={{ padding: '20px 20px 8px' }}>
        <h2 style={{ fontSize: 20, marginBottom: 12 }}>Amendements conseillés</h2>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {recs.map((r,i) => (
            <div key={i} style={{
              padding: 16, borderRadius: 18, background: '#fff',

              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 8 }}>

const TWEAKS = /*EDITMODE-BEGIN*/{
  "accent": "forest",
  "triangleStyle": "clean",
  "cardStyle": "soft"
}/*EDITMODE-END*/;

const INITIAL_ZONES = [
  { id: 'z1', name: 'Le Carré des Aromates', area: '~ 8 m²', exposure: 'Plein soleil', soilGuess: 'calcaire', created: 'il y a 3 jours', done: 3 },
  { id: 'z2', name: 'Verger Nord',           area: '~ 45 m²', exposure: 'Mi-ombre',    soilGuess: 'argileux', created: 'il y a 2 sem.', done: 6 },
  { id: 'z3', name: 'Prairie humide',        area: '~ 80 m²', exposure: 'Ombre',       soilGuess: 'humifere', created: 'il y a 1 mois', done: 1 },
];

function App() {
  const [route, setRoute] = useState(() => {
    try { return JSON.parse(localStorage.getItem('tc.route')) || { screen: 'home' }; }
    catch { return { screen: 'home' }; }
  });
  const [zones, setZones] = useState(INITIAL_ZONES);
  const [selectedPlants, setSelectedPlants] = useState(['ortie','plantain','chiendent']);
  const [tab, setTab] = useState('home');
  const [boudinResult, setBoudinResult] = useState(null);
  const [bocalResult, setBocalResult] = useState(null);
  const [tweaks, setTweaks] = useState(TWEAKS);
  const [tweaksOpen, setTweaksOpen] = useState(false);

  useEffect(() => { localStorage.setItem('tc.route', JSON.stringify(route)); }, [route]);

  // Apply accent
  useEffect(() => {
    const accents = {
      forest:    { a: 'var(--tc-forest-800)', l: 'var(--tc-forest-100)' },
      terracotta:{ a: 'var(--tc-terra-600)', l: 'var(--tc-terra-100)' },
      ocre:      { a: 'var(--tc-ocre-500)', l: 'var(--tc-ocre-200)' },
    };
    const cfg = accents[tweaks.accent] || accents.forest;
    document.documentElement.style.setProperty('--tc-accent', cfg.a);
    document.documentElement.style.setProperty('--tc-accent-light', cfg.l);
  }, [tweaks.accent]);

  // Tweaks host protocol
  useEffect(() => {
    const handler = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const updateTweak = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };

  const currentZone = zones.find(z => z.id === route.zoneId);

  const go = (screen, extra = {}) => setRoute({ screen, ...extra });

  const addZone = (z) => {
    setZones([z, ...zones]);
    go('zone', { zoneId: z.id });
  };

  let screen;
  if (route.screen === 'home') {
    screen = <HomeScreen zones={zones}
      onCreate={() => go('create')}
      onOpenZone={(id) => go('zone', { zoneId: id })}
      onNavigate={(t) => { setTab(t); if (t === 'plants') go('bioindic', { zoneId: null }); }} />;
  } else if (route.screen === 'create') {
    screen = <CreateZoneScreen onBack={() => go('home')} onCreate={addZone} />;
  } else if (route.screen === 'zone' && currentZone) {
    screen = <ZoneScreen zone={currentZone}
      onBack={() => go('home')}
      onOpenMission={(mid) => {
        if (mid === 'm1') go('bioindic', { zoneId: currentZone.id });
        else if (mid === 'm3') go('boudin', { zoneId: currentZone.id });
        else if (mid === 'm4') go('bocal', { zoneId: currentZone.id });
        else if (mid === 'm7' || currentZone.done >= 4) go('dashboard', { zoneId: currentZone.id });
        else alert('Mission à venir dans le prototype');
      }}
      onNavigate={(t) => setTab(t)} />;
  } else if (route.screen === 'bioindic') {
    screen = <BioIndicScreen
      onBack={() => go(currentZone ? 'zone' : 'home', { zoneId: route.zoneId })}
      selected={selectedPlants} setSelected={setSelectedPlants}
      onConfirm={() => {
        if (currentZone) {
          setZones(zones.map(z => z.id === currentZone.id ? {...z, done: Math.max(z.done, 2)} : z));
          go('zone', { zoneId: currentZone.id });
        } else go('home');
      }} />;
  } else if (route.screen === 'boudin') {
    screen = <BoudinScreen
      onBack={() => go('zone', { zoneId: route.zoneId })}
      onFinish={(r) => { setBoudinResult(r);
        setZones(zones.map(z => z.id === currentZone.id ? {...z, done: Math.max(z.done, 4)} : z));
        go('zone', { zoneId: currentZone.id });
      }} />;
  } else if (route.screen === 'bocal') {
    screen = <BocalScreen
      onBack={() => go('zone', { zoneId: route.zoneId })}
      onFinish={(r) => { setBocalResult(r);
        setZones(zones.map(z => z.id === currentZone.id ? {...z, done: Math.max(z.done, 5)} : z));
        go('dashboard', { zoneId: currentZone.id });
      }} />;
  } else if (route.screen === 'dashboard' && currentZone) {
    screen = <DashboardScreen zone={currentZone}
      selectedPlants={selectedPlants}
      bocalResult={bocalResult} boudinResult={boudinResult}
      onBack={() => go('zone', { zoneId: currentZone.id })} />;
  } else {
    screen = <HomeScreen zones={zones} onCreate={() => go('create')}
      onOpenZone={(id) => go('zone', { zoneId: id })}
      onNavigate={() => {}} />;
  }

  return (
    <div>
      <PhoneFrame>{screen}</PhoneFrame>
      {tweaksOpen && <TweaksPanel tweaks={tweaks} update={updateTweak} />}
    </div>
  );
}

function TweaksPanel({ tweaks, update }) {
  return (
    <div style={{
      position: 'fixed', bottom: 20, right: 20, width: 260, zIndex: 1000,
      background: '#fff', borderRadius: 18, padding: 16,
      boxShadow: '0 24px 48px rgba(15,36,20,0.2)',
    }}>
      <div style={{ fontFamily: 'var(--tc-font-display)', fontSize: 16, fontWeight: 500, marginBottom: 12 }}>Tweaks</div>

      <div style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.08em', color: '#888', marginBottom: 6 }}>Couleur d'accent</div>
      <div style={{ display: 'flex', gap: 6, marginBottom: 14 }}>
        {[
          { k: 'forest', c: '#23442A', l: 'Forêt' },
          { k: 'terracotta', c: '#B85A00', l: 'Terracotta' },
          { k: 'ocre', c: '#9C8D56', l: 'Ocre' },
        ].map(o => (
          <button key={o.k} onClick={() => update('accent', o.k)}
            style={{
              flex: 1, padding: '8px 6px', borderRadius: 10, cursor: 'pointer',
              background: o.c, color: '#fff', fontSize: 11, fontWeight: 500,
              border: tweaks.accent === o.k ? '2px solid #000' : '2px solid transparent',
            }}>{o.l}</button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
